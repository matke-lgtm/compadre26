document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"flex:0 0 96px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Golf<\u002Fspan><span>Two rounds Friday, two rounds Saturday. At a minimum. Putting Park lit up every night.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"font-family:Bitter,Georgia,serif; font-size:19px; margin:26px 0 8px; padding-bottom:5px; border-bottom:1px solid #ddd8cc\">Course &amp; Property Links<\u002Fh2>\n  <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:5px 34px; font-size:14px; line-height:1.5\">\n    <div><a href=\"https://www.bootranchclub.com/club/scripts/custom/custom.asp?NS=GOLF&amp;PAGECFG=COURSETOURV2&amp;CID=1050#/\">Course tour video<\u002Fa> — what we are playing<\u002Fdiv>\n    <div><a href=\"https://www.bootranch.com/golf/\">Hole-by-hole tour<\u002Fa> — homework before Thursday<\u002Fdiv>\n    <div><a href=\"https://www.bootranch.com/wp-content/uploads/2025/07/2178-Boot-Ranch-Site-Amenity-Map-10-2024.pdf\">Full property &amp; amenity map<\u002Fa> (PDF)<\u002Fdiv>\n    <div><a href=\"https://www.bootranch.com/wp-content/uploads/2025/04/SH6-on-Master-Map.jpg\">Sunday House 6, circled on the master map<\u002Fa><\u002Fdiv>\n    <div><a href=\"map.html\">Route map<\u002Fa> — three drives, the gate, grocery stop<\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"font-family:Bitter,Georgia,serif; font-size:19px; margin:26px 0 8px; padding-bottom:5px; border-bottom:1px solid #ddd8cc\">The Roster<\u002Fh2>\n  <sc-raw-table style=\"width:100%; border-collapse:collapse; font-size:14.5px\">\n    <sc-raw-thead>\n      <sc-raw-tr>\n        <sc-raw-th style=\"text-align:left; font:600 10.5px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding:0 18px 7px 0\">Player<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align:left; font:600 10.5px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding:0 18px 7px 0\">Committee<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align:left style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc\">Austin<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; text-align:right; color:#b3aa99\">—<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; text-align:right; color:#b3aa99\">—<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; font-weight:700; white-space:nowrap\">Phillip Niels<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc\">Food<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; color:#5c6660\">Groceries, house dinners, snacks<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc\">Austin<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; text-align:right; color:#b3aa99\">—<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; text-align:right; color:#b3aa99\">—<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; font-weight:700; white-space:nowrap\">Daniel Rogers<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc\">Games<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; color:#5c6660\">Formats, pairings, scorecards, etc.<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc\">Terrell Hills<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; text-align:right; color:#b3aa99\">—<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; text-align:right; color:#b3aa99\">—<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <p style=\"font-size:12.5px; color:#5c6660; margin:8px 0 0\">Send GHIN indexes to Daniel by Sept 25 and he will post course handicaps off the Boot Ranch card. Strokes played at 100% of the difference, low man to scratch.<\u002Fp>\n\n  <h2 style=\"font-family:Bitter,Georgia,serif; font-size:19px; margin:26px 0 8px; padding-bottom:5px; border-bottom:1px solid #ddd8cc\">Getting There<\u002Fh2>\n  <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:28px; font-size:13.5px; line-height:1.5; break-inside:avoid\">\n    <div>\n      <div style=\"font:700 11.5px Karla; letter-spacing:.1em; text-transform:uppercase; color:#2f5d4a; margin-bottom:6px\">Austin · 80 mi · ~1:45<br><span style=\"color:#8a9490; letter-spacing:.06em\">JP &amp; Phil<\u002Fspan><\u002Fdiv>\n      <p style=\"margin:0\">US-290 West through Oak Hill, Dripping Springs, Johnson City and Stonewall. In Fredericksburg, US-290 becomes E. Main Street — stay on it, then turn <strong>right (north) on N. Llano St / TX-16<\u002Fstrong> and run 5 miles. Boot Ranch Circle is on the left.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font:700 11.5px Karla; letter-spacing:.1em; text-transform:uppercase; color:#9a5b2a; margin-bottom:6px\">Terrell Hills · 80 mi · ~1:35<br><span style=\"color:#8a9490; letter-spacing:.06em\">Daniel<\u002Fspan><\u002Fdiv>\n      <p style=\"margin:0\">I-410 West to I-10 West toward Boerne. Past Boerne take <strong>Exit 524 for Comfort<\u002Fstrong>, then US-87 North into Fredericksburg. Turn <strong>right on N. Llano St / TX-16<\u002Fstrong> and run 5 miles north. Boot Ranch Circle is on the left.<\u002Fp>\n    <\u002Fdiv>\n    \n  <\u002Fdiv>\n  <p style=\"font-size:13px; color:#5c6660; margin:12px 0 0; break-inside:avoid\"><strong style=\"color: rgb(29, 42, 36);\">Grocery stop:<\u002Fstrong> H-E-B on E. Main Street (US-290) in Fredericksburg, about 10 minutes before the gate. Phil will touch base prior to 10/1 on the list.&nbsp; |&nbsp;&nbsp;<strong style=\"color: rgb(29, 42, 36);\">Fajita pickup:<\u002Fstrong> Los Tios is on the way in for whoever comes through last (if this is what we want for dinner).<\u002Fp>\n\n  <h2 style=\"font-family:Bitter,Georgia,serif; font-size:19px; margin:26px 0 8px; padding-bottom:5px; border-bottom:1px solid #ddd8cc\">Daylight &amp; Tee Times<\u002Fh2>\n  <sc-raw-table style=\"width:100%; border-collapse:collapse; font-size:14px\">\n    <sc-raw-thead>\n      <sc-raw-tr>\n        <sc-raw-th style=\"text-align:left; font:600 10.5px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding:0 18px 7px 0\">Day<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align:left; font:600 10.5px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding:0 18px 7px 0\">Sunrise<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align:left; font:600 10.5px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding:0 18px 7px 0\">Sunset<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align:left; font:600 10.5px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding:0 18px 7px 0\">Recommended tees<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align:left; font:600 10.5px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding:0 18px 7px 0\">Done by<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; font-weight:600\">Thu, Oct 1<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; color:#8a9490\">N/A&nbsp;<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc\">7:20 PM<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding: 8px 18px 8px 0; border-top: 1px solid #ddd8cc; width: 224px\">Matty may play in the afternoon; Putting Park after dinner<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; color:#5c6660\">5:45 PM off a 2:00 tee<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; font-weight:600\">Fri, Oct 2<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc\">7:30 AM<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc\">7:19 PM<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; font-weight:600\">8:00 AM &amp; 12:40 PM<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; color:#5c6660\">4:40 PM<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; font-weight:600\">Sat, Oct 3<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc\">7:30 AM<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc\">7:18 PM<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; font-weight:600\">8:00 AM &amp; 12:40 PM<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; color:#5c6660\">4:40 PM<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; font-weight:600\">Sun, Oct 4<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc\">7:31 AM<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; color:#8a9490\">N/A<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; font-weight:600\">8:00 AM if anyone would like<\u002Fsc-raw-td>\n        <sc-raw-td style=\"padding:8px 18px 8px 0; border-top:1px solid #ddd8cc; color:#5c6660\">12:00 PM<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <p style=\"font-size:12.5px; color:#5c6660; margin:8px 0 0\">Four players riding, no outside groups. An 8:00 AM tee finishes around noon, lunch at 12:00, back out at 12:40, done by 4:40 — two hours of light left for the lake, the pickle ball courts, or a drink before somebody makes dinner. Nothing later than a 3:00 PM start gets 18 holes in before dark, so there is room for the schedule to slip.<\u002Fp>\n\n  <h2 style=\"font-family:Bitter,Georgia,serif; font-size:19px; margin:26px 0 10px; padding-bottom:5px; border-bottom:1px solid #ddd8cc; break-before:page\">Food &amp; The Pace of the Trip<\u002Fh2>\n  <p style=\"font-size:14px; line-height:1.6; margin:0 0 10px\">Two instincts in this group: cook every meal at the house, or let the club serve us. Both are good and we can have both without arguing about it on Thursday night. The plan below splits it — one pickup night, one house dinner, one served dinner — and everything golf-adjacent (tacos, box lunches, men's grill) comes from the club so nobody is cooking before a round.<\u002Fp>\n  <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:20px; font-size:13.5px; line-height:1.55; break-inside:avoid\">\n    <div>\n      <div style=\"font:700 11.5px Karla; letter-spacing:.1em; text-transform:uppercase; color:#2f5d4a; margin-bottom:6px\">Handled by the club<\u002Fdiv>\n      <p style=\"margin:0 0 6px\"><strong>Breakfast tacos in the clubhouse<\u002Fstrong> before each round, coffee to go from the men's grill.<\u002Fp>\n      <p style=\"margin:0 0 6px\"><strong>Box lunches ordered the morning of<\u002Fstrong> and delivered anywhere on property — Metzger Market between 8 and 9 has tables if we want to eat out there.<\u002Fp>\n      <p style=\"margin:0 0 6px\"><strong>Lunch in the men's grill<\u002Fstrong> between rounds is the easier version, and we have the time for it.<\u002Fp>\n      <p style=\"margin:0\"><strong>Coffee<\u002Fstrong> is handled: Keurig in the house and in every room, a drip maker if someone wants to bring a fancy roast, and coffee to go from the men's grill with the tacos.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font:700 11.5px Karla; letter-spacing:.1em; text-transform:uppercase; color:#9a5b2a; margin-bottom:6px\">Dinners<\u002Fdiv>\n      <p style=\"margin:0 0 6px\"><strong>Thursday — pickup.<\u002Fstrong> BBQ from the club or fajitas from Los Tios on the way in. Nobody cooks on arrival day.<\u002Fp>\n      <p style=\"margin:0 0 6px\"><strong>Friday — house dinner.<\u002Fstrong> Phil and whoever wants in. Grill, porch, standings read aloud.<\u002Fp>\n      <p style=\"margin:0\"><strong>Saturday — served.<\u002Fstrong> The clubhouse has a private patio with its own fireplace. Book it, order a bottle, let someone else clear the plates.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"font-size:12.5px; color:#5c6660; margin:12px 0 0\">Host's call to make by mid-September, since the patio and the BBQ both need a heads-up.<\u002Fp>\n\n  <h2 style=\"font-family:Bitter,Georgia,serif; font-size:19px; margin:26px 0 10px; padding-bottom:5px; border-bottom:1px solid #ddd8cc\">Fringe Time<\u002Fh2>\n  <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:6px 24px; font-size:13.5px; line-height:1.55; break-inside:avoid\">\n    <div style=\"display:flex; gap:10px\"><span style=\"flex:0 0 96px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Lake<\u002Fspan><span>Short cart ride. Lakes are stocked. Rods and bait and stuff are at the lake.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:10px\"><span style=\"flex:0 0 96px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Pickle ball<\u002Fspan><span>Quick game any afternoon, and a good Sunday morning option for anyone who does not want 18 more holes.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:10px\"><span style=\"flex:0 0 96px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Putting Park<\u002Fspan><span>Four-minute cart ride, lit after dark. On the table every night.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:10px\"><span style=\"flex:0 0 96px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Enchanted Rock<\u002Fspan><span>30 minutes north on TX-965. Worth it just to look at. Day passes sell out, so reserve one if you are going Thursday.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"font-family:Bitter,Georgia,serif; font-size:22px; margin:34px 0 4px; break-before:page\">Day 1 — Thursday, Oct 1<\u002Fh2>\n  <div style=\"height:2px; background:#1d2a24; margin-bottom:14px\"><\u002Fdiv>\n  <p style=\"font-size:13px; color:#5c6660; margin:-4px 0 14px\">Arrival day, loosely held. The only semi-fixed item is the Putting Park after dinner.<\u002Fp>\n\n  <div style=\"break-inside:avoid; margin-bottom:16px\">\n    <div style=\"font:600 16px Bitter,Georgia,serif; margin-bottom:6px\">9:00 AM — Host rolls out of Houston<\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Notes<\u002Fspan><span>Kids to school first, then straight out I-10. Through the gate around 1:00 PM.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid; margin-bottom:16px\">\n    <div style=\"font:600 16px Bitter,Georgia,serif; margin-bottom:6px\">2:00 PM (?)— Host's afternoon, open invitation<\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Option 1<\u002Fspan><span>Play a round. A 2:00 PM tee is in by 5:45, comfortably before dark.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Option 2<\u002Fspan><span>Practice park and the range, easy afternoon.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Option 3<\u002Fspan><span>Drive up to Enchanted Rock. Anyone who gets in early is welcome to join.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid; margin-bottom:16px\">\n    <div style=\"font:600 16px Bitter,Georgia,serif; margin-bottom:6px\">Afternoon — Others arrive<\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Gate house<\u002Fspan><span>Tell the guard you are in <strong>Sunday House 6<\u002Fstrong>.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">On the way in<\u002Fspan><span>H-E-B for the week's food and the cooler; if someone is coming around dinner time, they can grab the fajitas in town (if that is the call).<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">At the house<\u002Fspan><span>Everyone has his own room.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid; margin-bottom:16px\">\n    <div style=\"font:600 16px Bitter,Georgia,serif; margin-bottom:6px\">6:30 PM — Dinner, nobody cooking<\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Option 1<\u002Fspan><span>BBQ picked up at the club, eat at the house. <b>Need to order by Monday.<\u002Fb><\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Option 2<\u002Fspan><span>Fajitas from Los Tios, grabbed on the drive in.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid; margin-bottom:16px\">\n    <div style=\"font:600 16px Bitter,Georgia,serif; margin-bottom:6px\">8:15 PM — Putting Park under the lights<\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Getting there<\u002Fspan><span>Four-minute cart ride from the house.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Game<\u002Fspan><span>Putting Wolf, 18 holes. Winner picks the Friday morning pairings. No Cup points.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"font-family:Bitter,Georgia,serif; font-size:22px; margin:34px 0 4px\">Day 2 — Friday, Oct 2<\u002Fh2>\n  <div style=\"height:2px; background:#1d2a24; margin-bottom:14px\"><\u002Fdiv>\n\n  <div style=\"break-inside:avoid; margin-bottom:16px\">\n    <div style=\"font:600 16px Bitter,Georgia,serif; margin-bottom:6px\">7:15 AM — Breakfast tacos in the clubhouse<\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Notes<\u002Fspan><span>Tacos and coffee to go from the men's grill.&nbsp;<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Order lunch<\u002Fspan><span>Place box lunch orders if we are eating on the course.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid; margin-bottom:16px\">\n    <div style=\"font:600 16px Bitter,Georgia,serif; margin-bottom:6px\">8:00 AM — Round 1<\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Format<\u002Fspan><span>Four-ball match, 2 v 2. Pairings decided by the Thursday night putting winner.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Points<\u002Fspan><span>3 points to each member of the winning team, 1.5 each if halved.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid; margin-bottom:16px\">\n    <div style=\"font:600 16px Bitter,Georgia,serif; margin-bottom:6px\">12:00 PM — Lunch<\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Men's grill<\u002Fspan><span>Sit-down between rounds. We have the time for it.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">OR...<\u002Fspan><span>Box lunches at Metzger Market between Holes 8 and 9. Tables out there.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid; margin-bottom:16px\">\n    <div style=\"font:600 16px Bitter,Georgia,serif; margin-bottom:6px\">12:40 PM — Round 2<\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Format<\u002Fspan><span>Sixes — partners rotate every six holes, so everyone plays with everyone.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Points<\u002Fspan><span>1 point per six-hole segment to each winning partner; 0.5 if halved.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Finish<\u002Fspan><span>In by 4:40 PM.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid; margin-bottom:16px\">\n    <div style=\"font:600 16px Bitter,Georgia,serif; margin-bottom:6px\">5:00 PM — Potential: fishing at the lake<\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Notes<\u002Fspan><span>Cart down with drinks. Sunset is 7:19.&nbsp;<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid; margin-bottom:16px\">\n    <div style=\"font:600 16px Bitter,Georgia,serif; margin-bottom:6px\">Dinner — At the house<\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Notes<\u002Fspan><span>Phil and JP tell us what to do. Losers of Round 2 on cleanup.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">After<\u002Fspan><span>Putting Park, lights on, optional. Daniel reads out the standings.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"font-family:Bitter,Georgia,serif; font-size:22px; margin:34px 0 4px\">Day 3 — Saturday, Oct 3<\u002Fh2>\n  <div style=\"height:2px; background:#1d2a24; margin-bottom:14px\"><\u002Fdiv>\n\n  <div style=\"break-inside:avoid; margin-bottom:16px\">\n    <div style=\"font:600 16px Bitter,Georgia,serif; margin-bottom:6px\">7:15 AM — Breakfast tacos in the clubhouse<\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Notes<\u002Fspan><span>Same as Friday. Order today's lunches on the way through.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid; margin-bottom:16px\">\n    <div style=\"font:600 16px Bitter,Georgia,serif; margin-bottom:6px\">8:00 AM — Round 3<\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Format<\u002Fspan><span>Singles. Two head-to-head matches; the Friday points leader picks his partner.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Points<\u002Fspan><span>3 points for the win, 1.5 for a half, plus 1 to the low net score in the group.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid; margin-bottom:16px\">\n    <div style=\"font:600 16px Bitter,Georgia,serif; margin-bottom:6px\">12:00 PM — Lunch<\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Notes<\u002Fspan><span>Men's grill or box lunches, same as Friday. Check the kickoff times over lunch.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid; margin-bottom:16px\">\n    <div style=\"font:600 16px Bitter,Georgia,serif; margin-bottom:6px\">12:40 PM — Round 4<\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Format<\u002Fspan><span>Wolf, full 18. Lone Wolf doubles the hole; blind Wolf off the tee triples it.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Points<\u002Fspan><span>Wolf standings convert to Cup points: 3 for first, 2 second, 1 third.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Finish<\u002Fspan><span>Done by 4:40 PM.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid; margin-bottom:16px\">\n    <div style=\"font:600 16px Bitter,Georgia,serif; margin-bottom:6px\">5:00 PM — College football<\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">On the board<\u002Fspan><span><strong>Big Ten:<\u002Fstrong> Nebraska hosts Maryland at Memorial Stadium for homecoming — the conference has it kicking off no later than 4:00 PM CT. <strong>SEC:<\u002Fstrong> Arkansas at Texas A&amp;M (Kyle Field) · Auburn at Tennessee · Alabama at Mississippi State · Florida at Missouri. Texas is on a bye — Red River is the following Saturday.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Kickoffs<\u002Fspan><span>Most windows are still TBD this far out — the SEC posts times about two weeks ahead, the Big Ten six to twelve days. Check the week before and slide the afternoon round if Nebraska–Maryland lands early.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid; margin-bottom:16px\">\n    <div style=\"font:600 16px Bitter,Georgia,serif; margin-bottom:6px\">Dinner — We have options.<\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Notes<\u002Fspan><span>Private clubhouse patio with its own fireplace. Order a bottle, get served.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Or<\u002Fspan><span>Dinner at the house if the group would rather stay in.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">After<\u002Fspan><span>Putting Park closer. Last chance to settle a tie.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"font-family:Bitter,Georgia,serif; font-size:22px; margin:34px 0 4px\">Day 4 — Sunday, Oct 4<\u002Fh2>\n  <div style=\"height:2px; background:#1d2a24; margin-bottom:14px\"><\u002Fdiv>\n\n  <div style=\"break-inside:avoid; margin-bottom:16px\">\n    <div style=\"font:600 16px Bitter,Georgia,serif; margin-bottom:6px\">8:00 AM — 9 holes, 18 holes, pickle ball, or the road<\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Golf<\u002Fspan><span>Matty will probably make the most of things and get in another round before heading home. Any and all are welcome to join.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><\u002Fdiv>\n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><span style=\"flex:0 0 108px; font:600 11px Karla; letter-spacing:.13em; text-transform:uppercase; color:#8a9490; padding-top:3px\">Decide<\u002Fspan><span>Saturday at dinner, so the host can confirm or drop the tee time.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid; margin-bottom:16px\">\n    \n    <div style=\"display:flex; gap:12px; font-size:14px; line-height:1.5\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"font-family:Bitter,Georgia,serif; font-size:22px; margin:34px 0 4px; break-before:page\">The Games<\u002Fh2>\n  <div style=\"height:2px; background:#1d2a24; margin-bottom:14px\"><\u002Fdiv>\n  <p style=\"font-size:14px; line-height:1.6; margin:0 0 16px\">Four rounds, four formats, one running total. Everyone partners everyone by Saturday afternoon, and no single bad round puts anybody out of it. Daniel keeps the card and reads the standings at dinner. All matches played at handicap, 100% of the difference off the low man.<\u002Fp>\n\n  <div style=\"break-inside:avoid; margin-bottom:18px\">\n    <div style=\"display:flex; align-items:baseline; gap:10px; margin-bottom:5px\"><span style=\"font:700 11px Karla; letter-spacing:.14em; text-transform:uppercase; color:#9a5b2a\">Round 1 · Fri AM<\u002Fspan><span style=\"font:600 17px Bitter,Georgia,serif\">Four-Ball Match<\u002Fspan><span style=\"font-size:12.5px; color:#8a9490\">3 points available each<\u002Fspan><\u002Fdiv>\n    <p style=\"margin:0; font-size:13.5px; line-height:1.55\">Two vs. two; match play; best net ball of the partners on every hole. Pairings decided by whoever wins Thursday night's putting. <strong>3 points to each man on the winning side, 1.5 each if the match is halved.<\u002Fstrong> Press rules: none. Keep it simple on day one.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid; margin-bottom:18px\">\n    <div style=\"display:flex; align-items:baseline; gap:10px; margin-bottom:5px\"><span style=\"font:700 11px Karla; letter-spacing:.14em; text-transform:uppercase; color:#9a5b2a\">Round 2 · Fri PM<\u002Fspan><span style=\"font:600 17px Bitter,Georgia,serif\">Sixes<\u002Fspan><span style=\"font-size:12.5px; color:#8a9490\">3 points available each<\u002Fspan><\u002Fdiv>\n    <p style=\"margin:0; font-size:13.5px; line-height:1.55\">Three six-hole matches with rotating partners: holes 1–6, 7–12, 13–18. Every man partners every other man once. Each six-hole segment is its own best net ball match. <strong>1 point to each winning partner per segment, 0.5 each if halved.<\u002Fstrong>&nbsp;<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid; margin-bottom:18px\">\n    <div style=\"display:flex; align-items:baseline; gap:10px; margin-bottom:5px\"><span style=\"font:700 11px Karla; letter-spacing:.14em; text-transform:uppercase; color:#9a5b2a\">Round 3 · Sat AM<\u002Fspan><span style=\"font:600 17px Bitter,Georgia,serif\">Singles<\u002Fspan><span style=\"font-size:12.5px; color:#8a9490\">4 points available each<\u002Fspan><\u002Fdiv>\n    <p style=\"margin:0; font-size:13.5px; line-height:1.55\">Two head-to-head matches, net. The Friday points leader picks his opponent; the other two play each other. <strong>3 points for winning your match, 1.5 for a half, plus 1 bonus point to the low net score of the whole group.<\u002Fstrong> This is the round where somebody in last place can climb back in.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"break-inside:avoid; margin-bottom:18px\">\n    <div style=\"display:flex; align-items:baseline; gap:10px; margin-bottom:5px\"><span style=\"font:700 11px Karla; letter-spacing:.14em; text-transform:uppercase; color:#9a5b2a\">Round 4 · Sat PM<\u002Fspan><span style=\"font:600 17px Bitter,Georgia,serif\">Wolf<\u002Fspan><span style=\"font-size:12.5px; color:#8a9490\">3 points to the winner<\u002Fspan><\u002Fdiv>\n    <p style=\"margin:0; font-size:13.5px; line-height:1.55\">Rotating Wolf order off every tee. The Wolf picks a partner after watching the other three drive, or goes <strong>Lone Wolf<\u002Fstrong> for double, or declares <strong>Blind Wolf<\u002Fstrong> before anyone hits for triple. Hole values in wolf points; keep the tally on the card. <strong>At the end of the round the wolf standings convert to Cup points: 3 for first, 2 for second, 1 for third.<\u002Fstrong> Best format to finish on — a good closing stretch can flip the whole trip.<\u002Fp>\n  <\u002Fdiv>\n\n  <h3 style=\"font-family:Bitter,Georgia,serif; font-size:16px; margin:26px 0 8px\">The Card<\u002Fh3>\n  <sc-raw-table style=\"width:100%; border-collapse:collapse; font-size:13.5px\">\n    <sc-raw-thead>\n      <sc-raw-tr>\n        <sc-raw-th style=\"tex
